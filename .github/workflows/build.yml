name: Build extension

# Builds the extension for Chrome, Firefox, and Safari on every push to main
# and every pull request. Each target's zip(s) are uploaded as a downloadable
# workflow artifact.
#
# Pull requests are included so a change that breaks one target's bundle is
# caught in review — previously this ran only after the merge had already
# landed on main, and a reviewer had no build to download and try.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel an in-progress run when a newer commit lands on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [chrome, firefox, safari]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and zip (${{ matrix.target }})
        run: bunx wxt zip -b ${{ matrix.target }}

      - name: Upload ${{ matrix.target }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-build
          path: .output/*.zip
          # The zips live in .output/, a dotfile dir. upload-artifact@v4 treats
          # anything under a hidden parent as hidden and skips it by default,
          # which makes the glob match nothing and fail with if-no-files-found.
          include-hidden-files: true
          if-no-files-found: error

name: CI

# Type-check and unit tests on every pull request and every push to main.
#
# build.yml answers "does it bundle"; this answers "is it correct". Neither ran
# on pull requests before, so nothing gated a merge — 299 tests existed and none
# of them could fail a PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: this job only reads the tree to type-check and test. Without
# an explicit block it inherits the repository default, which can be write — an
# unnecessary token for a workflow that runs third-party tooling over
# pull-request code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # `wxt prepare` runs from postinstall and generates .wxt/tsconfig.json,
      # which the root tsconfig extends. Skipping the install would leave
      # vue-tsc with no resolvable config at all.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run compile

      - name: Unit tests
        run: bun run test
